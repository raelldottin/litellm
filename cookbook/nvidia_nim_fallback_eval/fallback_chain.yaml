model_list:
- model_name: Hermes Kanban
  litellm_params:
    model: auto_router/complexity_router
    complexity_router_config:
      tiers:
        SIMPLE: Hermes fallback ultra key1
        MEDIUM: Hermes fallback ultra key1
        COMPLEX: Hermes fallback ultra key1
        REASONING: Hermes fallback ultra key1
      default_model: Hermes fallback ultra key1
      classifier_type: heuristic
      enable_non_reasoning_tier: false
    complexity_router_default_model: Hermes fallback ultra key1
- model_name: Hermes fallback ultra key1
  litellm_params:
    model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
    api_base: https://integrate.api.nvidia.com/v1
    api_key: os.environ/NVIDIA_NIM_API_KEY
    timeout: 300
    max_retries: 0
    additional_drop_params:
    - reasoning_effort
    - max_completion_tokens
    allowed_openai_params:
    - max_retries
    extra_body:
      max_tokens: 16384
      chat_template_kwargs:
        enable_thinking: true
        medium_effort: true
  model_info:
    mode: chat
    base_model: nvidia/nemotron-3-ultra-550b-a55b
    context_window: 256000
    max_input_tokens: 239616
    max_output_tokens: 16384
