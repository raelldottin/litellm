# Provisional order from published benchmarks only. Re-rank with eval_fallback_chain.py before using it.
model_list:
  - model_name: glm-5.3-flash
    litellm_params: {model: nvidia_nim/z-ai/glm-5.3-flash, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: deepseek-v4.1-flash
    litellm_params: {model: nvidia_nim/deepseek-ai/deepseek-v4.1-flash, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: minimax-m3.1-flash
    litellm_params: {model: nvidia_nim/minimaxai/minimax-m3.1-flash, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: kimi-k2.6
    litellm_params: {model: nvidia_nim/moonshotai/kimi-k2.6, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: nemotron-3-ultra
    litellm_params: {model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: nemotron-3.5-lightning
    litellm_params: {model: nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b, api_key: os.environ/NVIDIA_NIM_API_KEY}

router_settings:
  num_retries: 1
  timeout: 120
  fallbacks:
    - glm-5.3-flash: [deepseek-v4.1-flash, minimax-m3.1-flash, kimi-k2.6, nemotron-3-ultra, nemotron-3.5-lightning]
